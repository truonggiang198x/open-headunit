name: Build Release APK (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble github release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout đúng tag đã rà (v.3.5.0)
        uses: actions/checkout@v4
        with:
          repository: andreknieriem/open-headunit
          ref: v.3.5.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleGithubRelease --no-daemon --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-github-release-unsigned
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
